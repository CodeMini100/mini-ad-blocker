<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Demo: Test Page with Ad Banners</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!--
    This page demonstrates how to display ad placements
    using .ad-banner elements and a reference to an ad script.
    Replace "path/to/your/ad-script.js" with the actual path to your production ad script.
  -->
  <script async src="path/to/your/ad-script.js"></script>
</head>
<body>

  <!--
    Ad Banner Container #1
    Use the .ad-banner class to style or position the ad space as needed.
  -->
  <div class="ad-banner" data-ad-slot="banner1"></div>

  <!-- Ad Banner Container #2 -->
  <div class="ad-banner" data-ad-slot="banner2"></div>

  <!-- Ad Banner Container #3 -->
  <div class="ad-banner" data-ad-slot="banner3"></div>

  <!--
    Additional script or ad initialization can go here.
    Example:
    <script>
      // Initialize your ad provider
      // adProvider.init();
    </script>
  -->

</body>
</html>
